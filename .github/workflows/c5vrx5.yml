name: C5VRX-5 Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'hardware_experiments/**'
      - 'test/**'
      - 'research/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.psram.defaults'
      - '!**/*.md'
      - '.github/workflows/c5vrx5.yml'
  pull_request:
    # Closed PR channels are removed by pr-channel-cleanup.yml.
    types: [opened, synchronize, reopened]
    paths:
      - 'main/**'
      - 'hardware_experiments/**'
      - 'test/**'
      - 'research/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.psram.defaults'
      - '!**/*.md'
      - '.github/workflows/c5vrx5.yml'
permissions:
  contents: read
concurrency:
  group: c5vrx5-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Hardware experiments (hardware_experiments/<id>/hwx.h): the same firmware
  # with an experiment's pin map, published per experiment for the flasher's
  # Hardware experiments tab. Never a Latest release.
  hwx-list:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: List hardware experiments
        id: list
        run: |
          set -euo pipefail
          ids="$(find hardware_experiments -mindepth 2 -maxdepth 2 -name hwx.h -printf '%h\n' 2>/dev/null \
            | xargs -r -n1 basename | sort | jq -R . | jq -sc .)"
          # Ids become release tags (c5vrx5-hwx-<id>-v5.0.N / -pr-N): no hyphens.
          jq -e 'all(.[]; test("^[a-z0-9_]+$"))' <<< "$ids" > /dev/null
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"
          echo "Hardware experiments: ${ids}"
  build-hwx:
    needs: hwx-list
    if: needs.hwx-list.outputs.ids != '[]'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.hwx-list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build hardware experiment ${{ matrix.id }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HWX: ${{ matrix.id }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          if [[ -n "$PR_NUMBER" ]]; then version="5.0.0-pr.${PR_NUMBER}-hwx.${HWX}";
          else version="5.0.${GITHUB_RUN_NUMBER}-hwx.${HWX}"; fi
          idf.py -B build-hwx -DSDKCONFIG=build-hwx/sdkconfig -DC5VRX_HWX="$HWX" \
            -DC5VRX5_VERSION="$version" -DC5VRX5_COMMIT="$BUILD_SHA" build
          mkdir -p release
          cp build-hwx/c5vrx5.bin build-hwx/bootloader/bootloader.bin \
             build-hwx/partition_table/partition-table.bin build-hwx/flasher_args.json release/
          esptool.py --chip esp32c5 merge_bin -o release/c5vrx5_merged.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x2000 release/bootloader.bin 0x8000 release/partition-table.bin 0x10000 release/c5vrx5.bin
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s\n' "$BUILD_SHA" > release/COMMIT
          python3 tools/firmware_input_hash.py 5 "$HWX" > release/FIRMWARE_INPUT_SHA
          printf '%s\n' "$version" > release/VERSION
          printf '%s\n' "$HWX" > release/HWX
          cp "hardware_experiments/${HWX}/hwx.h" release/
          cd release && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: c5vrx5-hwx-${{ matrix.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: release/
  build-psram:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build opt-in XIAO PSRAM image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-psram -DSDKCONFIG=sdkconfig.psram \
            "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.psram.defaults" build
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve version
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Main builds are 5.0.<run number> (immutable tag c5vrx5-v5.0.N);
          # PR builds share one mutable channel per PR.
          if [[ -n "$PR_NUMBER" ]]; then
            echo "version=5.0.0-pr.${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=c5vrx5-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=5.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=c5vrx5-v5.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Host tests (quiet test, VTX deviation profile, dropout classifier, AFC, gain fade)
        shell: bash
        working-directory: test
        run: |
          set -euo pipefail   # each compile on its own line: in "cc && ./t" a failed cc did not stop -e
          for t in test_quiet test_profile test_diag test_afc test_afc_measure test_control_window test_cn_observation test_transport_recovery test_calibration_noise test_sphase test_dco_slots test_dc_servo test_flightlog test_rx_state test_dac_check test_sense_metrics; do
            cc -O2 -std=c11 -Wall -Wextra -Werror -I../main "$t.c" -lm -o "/tmp/$t"
            "/tmp/$t" | tail -1
          done
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_dc_trim.c -o /tmp/test_dc_trim
          /tmp/test_dc_trim
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_dc_live.c -lm -o /tmp/test_dc_live
          /tmp/test_dc_live ../research/data/walk_2026-10-13
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_no_signal_raster.c ../main/menu_raster.c -lm -o /tmp/test_no_signal_raster
          /tmp/test_no_signal_raster
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_menu_ui.c ../main/menu_ui.c -o /tmp/test_menu_ui
          /tmp/test_menu_ui
          python3 ../tools/menu_font.py --check
          python3 ../tools/dco_preset.py --check ../main/dco_preset.h ../research/data/dco_preset_2026-10-26/*.txt
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_agc_table.c ../main/arc_phy.c -o /tmp/test_agc_table
          /tmp/test_agc_table | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -DEXPECT_FADE_HOLD -I../main test_gain_fade.c \
            ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_gain_fade
          /tmp/test_gain_fade | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_gain_preset.c \
            ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_gain_preset
          /tmp/test_gain_preset | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_gain_v7.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_gain_v7
          /tmp/test_gain_v7
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_rx_level.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_rx_level
          /tmp/test_rx_level
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_keel_track.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_keel_track
          /tmp/test_keel_track | grep -v "^S,"
          # AGC models (agc.c) against KEEL-1, scored on the measured demod quality (level_quality.h)
          # with the blackbox write cost: nominal and a board-like gain-model error.
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main -DSKIP_BOUNDS -DAGC_CHECKS -DPICTURE_Q -DWRITE_COST_US=7000 test_agc_compare.c ../main/agc.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_agc_compare
          /tmp/test_agc_compare | tail -5
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main -DSKIP_BOUNDS -DAGC_CHECKS -DPICTURE_Q -DWRITE_COST_US=7000 -DGAIN_ERR_DB=1.0 -DGAIN_ERR_LOW_DB=6.0 test_agc_compare.c ../main/agc.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_agc_compare_err
          /tmp/test_agc_compare_err | tail -5
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_agc_options.c ../main/agc.c -lm -o /tmp/test_agc_options
          /tmp/test_agc_options
          # LEVEL and the core near the table floor (an external LNA close in)
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_agc_strong.c ../main/agc.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_agc_strong
          /tmp/test_agc_strong | tail -1
          # STRONG LANE: a coarser IQ lane when the floor rows still fold (policy only)
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_strong_lane.c -o /tmp/test_strong_lane
          /tmp/test_strong_lane
          # LEVEL's carrier radius of a folded window on the exact hardware fold model (adc_fold.h)
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_fold_radius.c ../main/agc.c -lm -o /tmp/test_fold_radius
          /tmp/test_fold_radius
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_cn_auto.c -lm -o /tmp/test_cn_auto
          /tmp/test_cn_auto
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_gain_measured.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_gain_measured
          /tmp/test_gain_measured
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_gain_track.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_gain_track
          /tmp/test_gain_track | grep -v "^R," | tail -8
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_gain_measure.c ../main/gain.c ../main/arc_phy.c -lm -o /tmp/test_gain_measure
          /tmp/test_gain_measure ../research/data/walk_2026-10-13 ../research/data/afc_2026-10-18 ../research/data/edge_dc_2026-10-19 | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_video_quality.c -lm -o /tmp/test_video_quality
          /tmp/test_video_quality ../research/data/afc_2026-10-18 ../research/data/edge_dc_2026-10-19 | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_afc_evidence.c -o /tmp/test_afc_evidence
          /tmp/test_afc_evidence
          # AUTO OUTPUT: affine DAC word and the sync/white-referenced level policy
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../main test_output_auto.c -lm -o /tmp/test_output_auto
          /tmp/test_output_auto
      - name: Archived kp helper regressions (not firmware)
        shell: bash
        run: |
          set -euo pipefail
          for t in test_kp_ladder test_kp_lut_io test_kp_switch_guard; do
            cc -O2 -std=c11 -Wall -Wextra -Werror -Imain -Iresearch/legacy_demod "research/legacy_demod/kp_only_$t.c" -lm -o "/tmp/$t"
            "/tmp/$t" | tail -1
          done
          cc -O2 -std=c11 -Wall -Wextra -Werror -Imain -Iresearch/legacy_demod research/legacy_demod/test_dc_center_lut.c -lm -o /tmp/test_dc_center_lut
          /tmp/test_dc_center_lut
      - name: Diagnostic log semantics
        run: |
          python3 test/test_field_diag_compare.py
          python3 test/test_dac_check_tool.py
          python3 test/test_flash_tool.py
          python3 test/test_diag_snapshot_runtime.py
          python3 test/test_flight_log_tool.py
          python3 test/test_experimental_phy.py
          python3 test/test_experimental.py
          python3 test/test_sample_clock_runtime.py
          python3 test/test_hwx.py
          python3 test/test_settings.py
          python3 test/test_phy_observation_hook.py
          python3 test/test_bank1_watch_runtime.py
          python3 test/test_11p_runtime.py
          python3 test/test_dfilt_runtime.py
          python3 test/test_gain_map_context.py
          python3 test/test_afc_telemetry.py
          python3 test/test_sphase_runtime.py
          python3 test/test_sense_lab_tool.py
          python3 test/test_bias_suite_runtime.py
          python3 test/test_current_suite_runtime.py
          python3 test/test_loopcap_suite_runtime.py
          python3 test/test_spur_suite_runtime.py
          python3 test/test_phase_repair_runtime.py
          python3 test/test_calibration_search_runtime.py
          python3 test/test_manual_calibration_runtime.py
          python3 test/test_boot_memory_runtime.py
      - name: Analytic IQ lane reference
        shell: bash
        run: |
          python3 -m venv /tmp/iqf-test-env
          /tmp/iqf-test-env/bin/pip install numpy scipy numba
          OPENBLAS_NUM_THREADS=1 /tmp/iqf-test-env/bin/python test/test_iq_lane_fusion.py
          python3 "$IDF_PATH/tools/bsasm.py" research/iq_lane_mixed468.bsasm /tmp/iq_lane_mixed468.bsbin \
            -c "$IDF_PATH/components/esp_driver_bitscrambler/bsasm_targets/esp32c5.json"
      - name: U85Q-LP research program (assembles; emulator matches U85Q and the LP model)
        shell: bash
        run: |
          python3 "$IDF_PATH/tools/bsasm.py" research/legacy_demod/u85q_lp.bsasm /tmp/u85q_lp.bsbin \
            -c "$IDF_PATH/components/esp_driver_bitscrambler/bsasm_targets/esp32c5.json"
          /tmp/iqf-test-env/bin/python research/u85q_lp.py check
      - name: Kp ladder tables (generator reproduces the U85Q LUTs; kp_tables.h current)
        run: /tmp/iqf-test-env/bin/python research/kp_morph.py check
      - name: U80P64-R1 transfer and assembled datapath
        run: |
          /tmp/iqf-test-env/bin/python test/test_p64.py
          /tmp/iqf-test-env/bin/python test/test_picture_sync.py
          /tmp/iqf-test-env/bin/python research/p64_validation.py --check
      - name: U50P64-R1 range decoder (table, program and transfer gates current)
        run: /tmp/iqf-test-env/bin/python research/u50p64.py --check
      - name: D32-R2 strong-signal decoder (table, program and transfer gates current)
        run: /tmp/iqf-test-env/bin/python research/nl_tracker.py --check
      - name: Historical kp/LP replay (retired policy baseline)
        run: /tmp/iqf-test-env/bin/python research/ladder_gate.py check research/data/ladder_gate_rates.json
      - name: OUTPUT research invariants (DAC-only changes and bounded policy)
        run: /tmp/iqf-test-env/bin/python research/output_level.py --check
      - name: LEVEL quality table (level_quality.h matches the measured demod grid)
        run: /tmp/iqf-test-env/bin/python research/level_quality.py --check
      - name: Fold radius table (fold_radius_table.h matches the hardware fold model)
        run: /tmp/iqf-test-env/bin/python research/fold_radius.py header --check
      - name: Build C5VRX-5
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DC5VRX5_VERSION="${{ steps.version.outputs.version }}" \
            -DC5VRX5_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}" build
      - name: Package firmware for web flashing
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p release
          cp build/c5vrx5.bin build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin build/flasher_args.json release/
          esptool.py --chip esp32c5 merge_bin -o release/c5vrx5_merged.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x2000 release/bootloader.bin 0x8000 release/partition-table.bin 0x10000 release/c5vrx5.bin
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > release/COMMIT
          python3 tools/firmware_input_hash.py 5 > release/FIRMWARE_INPUT_SHA
          printf '%s\n' '${{ steps.version.outputs.version }}' > release/VERSION
          cd release && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: c5vrx5-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: release/
  publish:
    needs: [build, build-psram]
    # Fork builds never get write-capable publication.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c5vrx5-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
      - name: Publish C5VRX-5 build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # A PR closed during the build gets no channel (the cleanup sweep may already have run).
          if [[ -n "$PR_NUMBER" ]] &&
             [[ "$(gh pr view "$PR_NUMBER" --repo "$repo" --json state --jq .state)" != "OPEN" ]]; then
            echo "PR #${PR_NUMBER} is no longer open; not publishing."
            exit 0
          fi
          # Unchanged firmware inputs keep the existing build.
          if [[ -n "$PR_NUMBER" ]]; then previous="$TAG"; else
            previous="$(gh release list --repo "$repo" --limit 100 --json tagName,isDraft \
              | jq -r '.[] | select(.isDraft == false) | .tagName' \
              | grep -E '^c5vrx5-v5\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          if [[ -n "$previous" ]] && gh release view "$previous" --repo "$repo" >/dev/null 2>&1; then
            dir="$(mktemp -d)"
            if gh release download "$previous" --repo "$repo" --pattern FIRMWARE_INPUT_SHA --dir "$dir" &&
               cmp -s "$dir/FIRMWARE_INPUT_SHA" release/FIRMWARE_INPUT_SHA; then
              echo "Firmware inputs unchanged; keeping $previous."
              # C5VRX-5 is the main firmware: its newest versioned build is
              # the repository's Latest release (never a PR prerelease).
              if [[ -z "$PR_NUMBER" ]]; then gh release edit "$previous" --repo "$repo" --latest; fi
              exit 0
            fi
            # Only PR channels are replaced; versioned main builds are immutable.
            if [[ -n "$PR_NUMBER" ]]; then gh release delete "$TAG" --repo "$repo" --yes --cleanup-tag; fi
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            title="C5VRX-5 — PR #${PR_NUMBER} / unmerged"
            flags=(--prerelease --latest=false)
          else
            title="C5VRX-5 v${VERSION}"
            flags=(--latest)   # main builds are the repository's Latest release
          fi
          gh release create "$TAG" release/* --repo "$repo" --target "$BUILD_SHA" --title "$title" \
            "${flags[@]}" \
            --notes "C5VRX-5 ${VERSION} at ${BUILD_SHA}. Use Full firmware when switching from another generation."
  publish-hwx:
    # Host tests run in build: an experiment is only published beside a passing production build.
    needs: [hwx-list, build, build-hwx]
    if: >-
      needs.hwx-list.outputs.ids != '[]' && (
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.hwx-list.outputs.ids) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c5vrx5-hwx-${{ matrix.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
      - name: Publish hardware experiment ${{ matrix.id }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HWX: ${{ matrix.id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if [[ -n "$PR_NUMBER" ]] &&
             [[ "$(gh pr view "$PR_NUMBER" --repo "$repo" --json state --jq .state)" != "OPEN" ]]; then
            echo "PR #${PR_NUMBER} is no longer open; not publishing."
            exit 0
          fi
          # Main: an immutable version per experiment, c5vrx5-hwx-<id>-v5.0.<run number>
          # (the run of c5vrx5-v5.0.<run number>); never replace its assets. PR: one
          # mutable channel per experiment and PR (cleanup: pr-channel-cleanup.yml).
          # Never the repository's Latest.
          if [[ -n "$PR_NUMBER" ]]; then
            tag="c5vrx5-hwx-${HWX}-pr-${PR_NUMBER}"
            previous="$tag"
            title="C5VRX-5 hardware experiment ${HWX} — PR #${PR_NUMBER} / unmerged"
          else
            tag="c5vrx5-hwx-${HWX}-v5.0.${GITHUB_RUN_NUMBER}"
            previous="$(gh release list --repo "$repo" --limit 200 --json tagName,isDraft \
              | jq -r '.[] | select(.isDraft == false) | .tagName' \
              | grep -E "^c5vrx5-hwx-${HWX}-v5\.[0-9]+\.[0-9]+$" | sort -V | tail -1 || true)"
            title="C5VRX-5 hardware experiment ${HWX} v5.0.${GITHUB_RUN_NUMBER}"
          fi
          # Unchanged firmware inputs keep the existing build.
          if [[ -n "$previous" ]] && gh release view "$previous" --repo "$repo" >/dev/null 2>&1; then
            dir="$(mktemp -d)"
            if gh release download "$previous" --repo "$repo" --pattern FIRMWARE_INPUT_SHA --dir "$dir" &&
               cmp -s "$dir/FIRMWARE_INPUT_SHA" release/FIRMWARE_INPUT_SHA; then
              echo "Firmware inputs unchanged; keeping $previous."
              exit 0
            fi
            # Only PR channels are replaced; versioned main builds are immutable.
            if [[ -n "$PR_NUMBER" ]]; then gh release delete "$tag" --repo "$repo" --yes --cleanup-tag; fi
          fi
          gh release create "$tag" release/* --repo "$repo" --target "$BUILD_SHA" --title "$title" \
            --prerelease --latest=false \
            --notes "Hardware experiment ${HWX} ($(cat release/VERSION)) at ${BUILD_SHA}. Not a receiver for goggles: see hwx.h for the pin map and wiring. Use Full firmware."
          # The unversioned main channel of PR #314/#315 (c5vrx5-hwx-<id>) is replaced by versions.
          if [[ -z "$PR_NUMBER" ]] && gh release view "c5vrx5-hwx-${HWX}" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "c5vrx5-hwx-${HWX}" --repo "$repo" --yes --cleanup-tag
          fi
